<!-- 7. Рубежный контроль 1 (Доступ по паролю) -->
<div onclick="openMc1Modal()" class="card" title="Рубежный контроль 1">
    <img src="pic-mc1-micro-ba.png" alt="Рубежный контроль 1">
</div>

<!-- Модальное окно авторизации РК1 -->
<div id="mc1-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white border-2 border-slate-200 rounded-2xl max-w-md w-full p-6 space-y-5 shadow-2xl relative">
        <button onclick="closeMc1Modal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 text-lg font-bold">✕</button>
        
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-indigo-50 border border-indigo-100 rounded-full flex items-center justify-center mx-auto text-indigo-900 text-2xl">
                🔒
            </div>
            <h3 class="text-xl font-bold text-slate-900 uppercase tracking-tight">Рубежный контроль 1</h3>
            <p class="text-xs text-slate-500">Введите предоставленный преподавателем пароль для доступа к сессии тестирования.</p>
        </div>

        <div class="space-y-3">
            <div>
                <input type="password" id="mc1-pass-input" placeholder="Введите пароль доступа" 
                       class="w-full border border-slate-300 rounded-xl p-3 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-600 font-mono tracking-wider text-center"
                       onkeydown="if(event.key==='Enter') verifyAndEnterMc1()">
                <p id="mc1-error-msg" class="text-xs text-rose-600 font-bold mt-1.5 text-center hidden">Неверный пароль доступа!</p>
            </div>

            <button onclick="verifyAndEnterMc1()" class="w-full bg-[#001e50] hover:bg-indigo-900 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider transition shadow-lg">
                Войти в систему РК1
            </button>
        </div>
    </div>
</div>

<script>
    function openMc1Modal() {
        document.getElementById('mc1-modal').classList.remove('hidden');
        document.getElementById('mc1-pass-input').value = '';
        document.getElementById('mc1-error-msg').classList.add('hidden');
        setTimeout(() => document.getElementById('mc1-pass-input').focus(), 100);
    }

    function closeMc1Modal() {
        document.getElementById('mc1-modal').classList.add('hidden');
    }

    function verifyAndEnterMc1() {
        // Получаем ввод, очищаем пробелы, переводим в верхний регистр
        var inputVal = document.getElementById('mc1-pass-input').value.trim().toUpperCase();
        var errMsg = document.getElementById('mc1-error-msg');

        // Закодированное значение "BA-15102026MC1" в Base64 (в F12 пароль в чистом виде не виден)
        var secretKey = "QkEtMTUxMDIwMjZNQzE=";

        try {
            if (btoa(inputVal) === secretKey) {
                errMsg.classList.add('hidden');
                window.location.href = 'mc1/indexmc1.html';
            } else {
                errMsg.classList.remove('hidden');
            }
        } catch (e) {
            errMsg.classList.remove('hidden');
        }
    }
</script>
