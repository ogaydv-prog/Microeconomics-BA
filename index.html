<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Микроэкономика | БАиЭ AlmaU</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        /* Логотип AlmaU прижат в левый верхний угол на уровне заголовка */
        .top-left-logo {
            position: absolute;
            top: 22px;
            left: 20px;
            width: 60px;
            height: 60px;
            object-fit: contain;
            z-index: 10;
        }

        /* Шапка страницы */
        .header-container {
            width: 100%;
            max-width: 1150px;
            text-align: center;
            margin-top: 8px;
            margin-bottom: 28px;
            padding: 0 90px;
        }

        /* Увеличенный и слегка расширенный заголовок с аккуратным интервалом между буквами */
        h1 {
            display: inline-block;
            font-size: 58px;
            font-weight: 900;
            color: #001e50;
            -webkit-text-stroke: 1.4px #001e50;
            transform: scale(1.12, 1.38);
            transform-origin: center;
            margin-top: 14px;
            margin-bottom: 24px;
            letter-spacing: 3px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 15px;
            color: #64748b;
            max-width: 750px;
            line-height: 1.5;
            margin: 0 auto;
            font-weight: 500;
        }

        /* Сетка карточек */
        .grid-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1150px;
            width: 100%;
            justify-content: center;
            align-items: center;
            margin: auto 0;
            padding-bottom: 30px;
        }

        /* Тонкая серая рамка под цвет карточек */
        .card {
            display: block;
            text-decoration: none;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(100, 116, 139, 0.08);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 195px;
            height: 255px;
            position: relative;
            padding: 0;
            cursor: pointer;
            flex-shrink: 0;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.03);
            border-color: #001e50;
            box-shadow: 0 16px 30px rgba(0, 30, 80, 0.18);
        }

        .card:hover img {
            transform: scale(1.02);
        }

        .card.disabled {
            cursor: default;
            opacity: 0.88;
        }

        .card.disabled:hover {
            transform: none;
            border-color: #cbd5e1;
            box-shadow: 0 4px 12px rgba(100, 116, 139, 0.08);
        }

        footer {
            margin-top: auto;
            font-size: 14px;
            color: #718096;
            padding-top: 30px;
            padding-bottom: 20px;
            text-align: center;
            line-height: 1.6;
            width: 100%;
        }

        /* Планшеты и средние экраны */
        @media (max-width: 960px) {
            h1 {
                font-size: 44px;
                -webkit-text-stroke: 1.1px #001e50;
                transform: scale(1.1, 1.32);
                letter-spacing: 2.2px;
            }
        }

        /* ПОЛНАЯ АДАПТИВНОСТЬ ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ */
        @media (max-width: 768px) {
            body {
                padding: 14px 12px;
            }

            .top-left-logo {
                position: static;
                display: block;
                margin: 0 auto 10px auto;
                width: 52px;
                height: 52px;
            }

            .header-container {
                margin-top: 0;
                margin-bottom: 20px;
                padding: 0 4px;
            }

            h1 {
                font-size: clamp(24px, 7.6vw, 36px);
                -webkit-text-stroke: 1px #001e50;
                transform: scale(1.08, 1.32);
                transform-origin: center;
                letter-spacing: 1.8px;
                margin-top: 10px;
                margin-bottom: 18px;
            }

            .subtitle {
                font-size: 13px;
                line-height: 1.4;
                padding: 0 4px;
            }

            /* Четкая сетка из 2 колонок для всех смартфонов */
            .grid-container {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                padding-bottom: 20px;
                max-width: 420px;
            }

            .card {
                width: 100%;
                height: auto;
                aspect-ratio: 195 / 255;
                border-radius: 12px;
            }

            footer {
                font-size: 12px;
                padding-top: 20px;
                padding-bottom: 15px;
            }
        }

        @media (max-width: 360px) {
            .grid-container {
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <!-- Логотип AlmaU (прижат в левый верхний угол на ПК, по центру на смартфонах) -->
    <img src="https://ogaydv-prog.github.io/Microeconomics-BA/almau.jpg"
         alt="AlmaU Logo"
         class="top-left-logo"
         onerror="this.onerror=null; this.src='./almau.jpg';">

    <header class="header-container">
        <h1>МИКРОЭКОНОМИКА</h1>
        <div style="max-width: 800px; margin: 0 auto; line-height: 1.6;">
            <p class="subtitle">
                Интерактивный образовательный портал <span style="color: #cbd5e1; font-weight: 300; margin: 0 6px;">|</span> Бизнес-Аналитика и Экономика
            </p>
            <p style="color: #94a3b8; font-size: 14px; font-weight: 500; margin-top: 4px; text-align: center;">
                AlmaU 2026
            </p>
        </div>
    </header>

    <main class="grid-container">
        <!-- 1. Темы курса -->
        <a href="topics.html" class="card" title="Темы и материалы курса">
            <img src="pic-topics-micro-ba.png" alt="Темы курса">
        </a>

        <!-- 2. Силлабус -->
        <a href="syllabus.html" class="card" title="Силлабус и программа курса">
            <img src="pic-sill-micro-ba.png" alt="Силлабус">
        </a>

        <!-- 3. Учебники -->
        <a href="https://drive.google.com/file/d/1JaaFr7DnzFRNhBwd49AMFlXhXln8_B5a/view?usp=sharing" target="_blank" rel="noopener noreferrer" class="card" title="Учебники и основная литература">
            <img src="pic-book-micro-ba.png" alt="Учебники и литература">
        </a>

        <!-- 4. Глоссарий -->
        <a href="https://www.economist.com/economics-a-to-z" target="_blank" rel="noopener noreferrer" class="card" title="Экономический глоссарий The Economist">
            <img src="pic-gloss-micro-ba.png" alt="Глоссарий">
        </a>

        <!-- 5. Экономические новости -->
        <a href="news.html" class="card" title="Экономические новости и аналитика">
            <img src="pic-news-micro-ba.png" alt="Экономические новости">
        </a>

        <!-- 6. Видеоматериалы -->
        <a href="video.html" class="card" title="Видеолекции и видеоматериалы">
            <img src="pic-video-micro-ba.png" alt="Видеоматериалы">
        </a>

        <!-- 7. Рубежный контроль 1 (Прямой переход без пароля) -->
        <a href="MC1/index_mc1.html" class="card" title="Рубежный контроль 1">
            <img src="pic-mc1-micro-ba.png" alt="Рубежный контроль 1">
        </a>

        <!-- 8. Рубежный контроль 2 -->
        <div class="card disabled" title="Рубежный контроль 2 — Скоро">
            <img src="pic-mc2-micro-ba.png" alt="Рубежный контроль 2">
        </div>

        <!-- 9. Финальный экзамен -->
        <div class="card disabled" title="Финальный экзамен — Подготовка">
            <img src="pic-exam-micro-ba.png" alt="Финальный экзамен">
        </div>

        <!-- 10. Оценки и критерии -->
        <a href="grade.html" class="card" title="Система оценивания и успеваемость">
            <img src="pic-grade-micro-ba.png" alt="Система оценивания">
        </a>
    </main>

    <footer>
        <p>Разработано для студентов ОП «Бизнес-Аналитика и Экономика» | Микроэкономика</p>
        <p>© Almaty Management University | Школа цифровых технологий и экономики 2026</p>
    </footer>

</body>
</html>
