<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд издержек производства | AlmaU 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; }
        .tab-btn.active { background-color: #1e293b; color: #38bdf8; border-bottom: 3px solid #38bdf8; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Верхняя навигация дашборда -->
    <header class="bg-[#001e50] border-b border-slate-700 px-6 py-3 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <img src="almau.jpg" alt="AlmaU" class="h-10 w-10 object-contain rounded-lg bg-white p-1">
            <div>
                <h1 class="text-base font-bold text-white">Тема 5: Аналитический дашборд издержек</h1>
                <p class="text-xs text-slate-300">Сравнительный анализ: академическая модель vs кейс T-Shirt Industry</p>
            </div>
        </div>

        <!-- Переключатель вкладок -->
        <div class="flex bg-slate-900 rounded-xl p-1 border border-slate-700">
            <button id="btn-tab1" onclick="switchTab('sim1')" class="tab-btn active px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2">
                <i class="fa-solid fa-chart-line"></i> Академическая модель (SE)
            </button>
            <button id="btn-tab2" onclick="switchTab('sim2')" class="tab-btn px-4 py-2 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition-all flex items-center gap-2">
                <i class="fa-solid fa-shirt"></i> Индустриальный кейс (T-Shirt)
            </button>
        </div>

        <a href="topic5.html" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-3 py-2 rounded-lg border border-slate-600 transition-all">
            ← К Теме 5
        </a>
    </header>

    <!-- Контейнеры симуляторов -->
    <main class="flex-1 w-full relative">
        <!-- Вкладка 1: Основной симулятор -->
        <iframe id="iframe-sim1" src="sim-production-costs-se.html" class="w-full h-[calc(100vh-65px)] border-0"></iframe>

        <!-- Вкладка 2: Индустриальный кейс (Замените URL если у вас внешняя ссылка или другое имя файла) -->
        <iframe id="iframe-sim2" src="sim-t-shirt-industry-cost.html" class="w-full h-[calc(100vh-65px)] border-0 hidden"></iframe>
    </main>

    <script>
        function switchTab(tab) {
            const iframe1 = document.getElementById('iframe-sim1');
            const iframe2 = document.getElementById('iframe-sim2');
            const btn1 = document.getElementById('btn-tab1');
            const btn2 = document.getElementById('btn-tab2');

            if (tab === 'sim1') {
                iframe1.classList.remove('hidden');
                iframe2.classList.add('hidden');
                btn1.classList.add('active', 'text-sky-400');
                btn1.classList.remove('text-slate-400');
                btn2.classList.remove('active', 'text-sky-400');
                btn2.classList.add('text-slate-400');
            } else {
                iframe2.classList.remove('hidden');
                iframe1.classList.add('hidden');
                btn2.classList.add('active', 'text-sky-400');
                btn2.classList.remove('text-slate-400');
                btn1.classList.remove('active', 'text-sky-400');
                btn1.classList.add('text-slate-400');
            }
        }
    </script>
</body>
</html>
