<!DOCTYPE html>
<html lang="ru" class="h-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд издержек производства | AlmaU 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; }
        .tab-btn { transition: all 0.2s ease-in-out; }
        .tab-btn.active { background-color: #1e293b; color: #38bdf8; border-bottom: 2px solid #38bdf8; }
    </style>
</head>
<body class="h-full flex flex-col">

    <!-- Верхнее меню хаба -->
    <header class="bg-[#001e50] border-b border-slate-700 px-4 py-2 flex flex-col sm:flex-row justify-between items-center gap-3 shrink-0 h-[56px]">
        <div class="flex items-center gap-3">
            <img src="almau.jpg" alt="AlmaU" class="h-8 w-8 object-contain rounded-lg bg-white p-1">
            <div>
                <h1 class="text-sm font-bold text-white leading-tight">Тема 5: Издержки производства</h1>
                <p class="text-[10px] text-slate-300">Интерактивный аналитический хаб</p>
            </div>
        </div>

        <!-- Переключатель 2 вкладок -->
        <div class="flex bg-slate-900 rounded-lg p-1 border border-slate-700">
            <button id="btn-tab1" onclick="switchTab('sim1')" class="tab-btn active px-3 py-1 rounded-md text-xs font-bold text-sky-400 flex items-center gap-2">
                <i class="fa-solid fa-chart-line"></i> <span>Академическая модель</span>
            </button>
            <button id="btn-tab2" onclick="switchTab('sim2')" class="tab-btn px-3 py-1 rounded-md text-xs font-bold text-slate-400 hover:text-white flex items-center gap-2">
                <i class="fa-solid fa-shirt"></i> <span>Кейс: T-Shirt Industry</span>
            </button>
        </div>

        <a href="topic5.html" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold px-3 py-1 rounded-lg border border-slate-600 transition-all flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-left"></i> <span>К Теме 5</span>
        </a>
    </header>

    <!-- Основной контейнер без прокрутки -->
    <main class="flex-1 w-full h-[calc(100vh-56px)] relative bg-[#0b0f13] overflow-hidden">
        <!-- Вкладка 1: Анализ издержек -->
        <iframe id="iframe-sim1" src="sim-production-costs-se.html" class="w-full h-full border-0 block"></iframe>

        <!-- Вкладка 2: Симулятор футболок -->
        <iframe id="iframe-sim2" src="sim-t-shirts.html" class="w-full h-full border-0 hidden"></iframe>
    </main>

    <script>
        function switchTab(tab) {
            const iframe1 = document.getElementById('iframe-sim1');
            const iframe2 = document.getElementById('iframe-sim2');
            const btn1 = document.getElementById('btn-tab1');
            const btn2 = document.getElementById('btn-tab2');

            if (tab === 'sim1') {
                iframe1.classList.remove('hidden');
                iframe1.classList.add('block');
                iframe2.classList.remove('block');
                iframe2.classList.add('hidden');

                btn1.classList.add('active', 'text-sky-400');
                btn1.classList.remove('text-slate-400');
                btn2.classList.remove('active', 'text-sky-400');
                btn2.classList.add('text-slate-400');
            } else {
                iframe2.classList.remove('hidden');
                iframe2.classList.add('block');
                iframe1.classList.remove('block');
                iframe1.classList.add('hidden');

                btn2.classList.add('active', 'text-sky-400');
                btn2.classList.remove('text-slate-400');
                btn1.classList.remove('active', 'text-sky-400');
                btn1.classList.add('text-slate-400');
            }
        }
    </script>
</body>
</html>
